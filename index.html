<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dust Rush Rally</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: full-bleed low-poly 3D stage; chunky tilted lettering and white paper cards float over it */
:root{
  --sky:#cdd6d9; --ink:#23282c; --paper:#fbfaf6; --paper-2:#efede6; --line:#d9d6cc;
  --orange:#f26b1d; --orange-d:#bd4e0f; --mute:#6b7378; --ok:#2f9e57; --bad:#d64532;
  --bronze:#c07b3f; --silver:#aeb5ba; --gold:#e3ad25; --plat:#46b9c2;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-weight:700;font-size:15px;line-height:1.4;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#gl,#ov2{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov2{pointer-events:none;touch-action:none}
#ov2.edit{pointer-events:auto}
#safe{position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);pointer-events:none;visibility:hidden}
#safeb{position:fixed;bottom:0;left:0;width:1px;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
#ui{position:fixed;inset:0;pointer-events:none}
body.racing,body.racing *{cursor:none!important}
#ui > .scr{pointer-events:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

.chunk{font-family:var(--display);color:#fff;letter-spacing:.01em;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 7px 0 var(--ink),0 12px 18px rgba(0,0,0,.25)}
.chunk.or{color:var(--orange)}

/* ---------- screens ---------- */
.scr{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 22px)}
.scr.dim{background:linear-gradient(90deg,rgba(35,40,44,.55),rgba(35,40,44,.25) 60%,rgba(35,40,44,0))}
@media (max-width:760px){.scr.dim{background:rgba(35,40,44,.45)}}
.wrap{max-width:760px;width:100%;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sp{flex:1}
.coins{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px;background:var(--paper);padding:5px 14px 5px 8px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e2a51c 60%,#a8740e);box-shadow:inset 0 0 0 2px rgba(120,80,0,.35);display:inline-block;flex:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.16),0 18px 40px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tilt{transform:rotate(-1.2deg)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:900}
h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,8vw,52px);line-height:.95;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1}
p{margin:0;max-width:62ch}
.muted{color:var(--mute)}
.btn{border:0;border-radius:12px;background:var(--paper);color:var(--ink);padding:11px 18px 9px;font-family:var(--display);font-size:20px;line-height:1;box-shadow:0 4px 0 #b9b6aa;transition:transform .08s,box-shadow .08s,background .15s}
.btn:hover{background:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9b6aa}
.btn.pri{background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
.btn.pri:hover{background:#ff7a2b}
.btn.pri:active{box-shadow:0 1px 0 var(--orange-d)}
.btn.sm{font-size:17px;padding:9px 13px 7px}
.btn.warn{background:#f6d7d2;box-shadow:0 4px 0 #d9aaa2}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* main menu */
.menu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;min-height:100%;gap:12px}
.title{grid-column:1 / -1;text-align:center;font-size:clamp(46px,11vw,120px);line-height:.9;margin-top:4px;transform:rotate(-2deg)}
.title small{display:block;font-size:.3em;letter-spacing:.12em;margin-top:6px}
.mleft{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:clamp(16px,3.4vh,34px);padding-left:clamp(0px,3vw,40px)}
.mbtn{background:none;border:0;padding:0;text-align:left;font-family:var(--display);font-size:clamp(40px,7.4vw,92px);line-height:.95;transition:transform .15s}
.mbtn .sub{display:block;font-family:var(--body);font-weight:900;font-size:14px;letter-spacing:.02em;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px rgba(0,0,0,.4);margin-top:4px}
.mbtn.d{transform:rotate(-13deg)}.mbtn.d:hover,.mbtn.d:focus-visible{transform:rotate(-13deg) scale(1.05)}
.mbtn.a{transform:rotate(-5deg)}.mbtn.b{transform:rotate(-8deg)}.mbtn.c{transform:rotate(-11deg)}
.mbtn.a:hover,.mbtn.a:focus-visible{transform:rotate(-5deg) scale(1.05)}.mbtn.b:hover,.mbtn.b:focus-visible{transform:rotate(-8deg) scale(1.05)}.mbtn.c:hover,.mbtn.c:focus-visible{transform:rotate(-11deg) scale(1.05)}
.mright{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:12px;padding-right:clamp(0px,3vw,40px)}
.garbtn{background:none;border:0;padding:0;font-family:var(--display);font-size:clamp(40px,6.5vw,80px);line-height:1;transform:rotate(-4deg);transition:transform .15s}
.garbtn:hover{transform:rotate(-4deg) scale(1.05)}
.icons{display:flex;gap:10px;transform:rotate(-4deg)}
.mcard{width:min(290px,100%);transform:rotate(-2.5deg);gap:10px;padding:16px;margin-top:6px}
.mcard .nm{font-size:26px}
.mcard .row{justify-content:space-between}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:10px;border-top:2px dashed var(--line)}
.mstat{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--display);font-size:20px;line-height:1}
.mstat i{width:16px;height:16px;border-radius:50%;display:block}
.mstat small{font-family:var(--body);font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.mcar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mute);min-width:0}
.mcar b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mcar .sw{width:18px;height:18px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.ibtn{width:62px;height:66px;border:0;border-radius:14px;background:var(--paper);box-shadow:0 6px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-size:24px;line-height:1;transition:transform .1s}
.ibtn small{font-family:var(--body);font-weight:900;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.ibtn:hover{transform:translateY(-3px)}
.mfoot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.keysbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:#fff;text-shadow:0 1px 0 var(--ink),0 0 6px rgba(0,0,0,.5)}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;padding:0 7px;background:var(--paper);color:var(--ink);border-radius:7px;box-shadow:0 3px 0 #a9a69b;font-family:var(--display);font-size:14px;text-shadow:none}
@media (max-width:640px){
  .scr.menuscr{overflow:hidden}
  .menu{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;height:100%;min-height:0;gap:6px}
  .title{font-size:clamp(36px,11vw,54px);margin-top:0}
  .mleft{padding-left:4px;margin-top:0;justify-content:center;gap:clamp(12px,2.6vh,22px)}
  .mbtn.a{transform:rotate(-3deg)}.mbtn.b{transform:rotate(-4deg)}.mbtn.c{transform:rotate(-5deg)}.mbtn.d{transform:rotate(-6deg)}
  .mbtn{font-size:clamp(28px,9.5vw,42px)}
  .mbtn .sub{display:none}
  .mright{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
  .garbtn{font-size:clamp(28px,9vw,38px)}
  .icons{gap:6px}
  .ibtn{width:48px;height:50px;font-size:19px}
  .mcard{width:100%;transform:none;padding:12px 14px;margin-top:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px}
  .mcard > .row:first-child,.mcard .mstats,.mcard .mcar{display:none}
  .mcard .nm{font-size:21px;grid-column:1}
  .mcard > .row{grid-column:1}
  .mcard .btn{grid-column:2;grid-row:1 / span 2}
  .mfoot{display:none}
}
@media (max-height:520px) and (min-width:641px){
  .scr.menuscr{overflow:hidden}
  .menu{height:100%;min-height:0;grid-template-rows:auto 1fr}
  .title{font-size:clamp(30px,7vh,52px)}
  .mbtn{font-size:clamp(24px,8vh,44px)}
  .mbtn .sub,.mfoot,.mcard .mstats,.mcard .mcar,.mcard > .row:first-child{display:none}
  .mright{gap:6px}
  .mleft{gap:clamp(12px,3.4vh,20px)}
  .mbtn.a{transform:rotate(-3deg)}.mbtn.b{transform:rotate(-4deg)}.mbtn.c{transform:rotate(-5deg)}.mbtn.d{transform:rotate(-6deg)}
  .garbtn{font-size:clamp(24px,7vh,40px)}
  .ibtn{width:46px;height:46px}
  .mcard{padding:10px 12px;gap:6px}
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.stage{border:0;text-align:left;font-weight:700;transition:transform .15s}
.stage.locked{opacity:.55}
.sgroup{display:flex;flex-direction:column;gap:10px}
.shead{display:flex;align-items:baseline;gap:12px}
.shead h3{font-size:30px}
.sdone{font-family:var(--display);color:#fff;font-size:18px;background:rgba(35,40,44,.6);padding:2px 10px;border-radius:999px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.sgrid .stage{padding:12px;gap:8px}
.sgrid .stage .nm{font-size:19px}
.sgrid .ssno{font-size:15px}
.stage:not(.locked):hover{transform:translateY(-3px) rotate(-.6deg)}
.ss{display:flex;align-items:center;gap:10px}
.ssno{font-family:var(--display);background:var(--orange);color:#fff;padding:3px 9px 1px;border-radius:7px;font-size:18px;transform:rotate(-3deg)}
.nm{font-family:var(--display);font-size:24px;line-height:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.tm{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.pips{display:flex;gap:4px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pip.on1{background:var(--bronze)}.pip.on2{background:var(--silver)}.pip.on3{background:var(--gold)}.pip.on4{background:var(--plat)}
.seg{display:inline-flex;background:var(--paper-2);border-radius:10px;padding:4px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:7px;font-size:14px;font-weight:800}
.seg button.on{background:var(--ink);color:#fff}
.tiers{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;font-variant-numeric:tabular-nums}
.tiers .dot{width:14px;height:14px;border-radius:50%}
.tiers .tm{text-align:right}
.tiers .rw{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.tiers .got{color:var(--ok)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);font-weight:800}
.inp{box-sizing:border-box;max-width:100%;background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;color:var(--ink);min-width:0;font-weight:700}
.inp.code{font-family:var(--mono);letter-spacing:.3em;text-transform:uppercase;font-size:22px;width:9ch}
textarea.inp{font-family:var(--mono);font-size:12px;font-weight:400;resize:vertical;min-height:70px;width:100%;user-select:text;-webkit-user-select:text}
input.inp{user-select:text;-webkit-user-select:text}
.note-s{font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;z-index:50;max-width:calc(100% - 32px);pointer-events:none}

/* garage */
.gar{overflow:hidden!important;padding:0!important}
.gtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));z-index:3}
.gtop .sp{flex:1}
.glist{position:absolute;left:max(20px,env(safe-area-inset-left,0px));top:50%;width:min(36vw,420px);z-index:2;pointer-events:auto}
.glist .in{transform:translateY(calc(var(--sel) * -48px - 24px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.gl{display:flex;align-items:center;gap:10px;height:48px;border:0;background:none;padding:0 4px;font-family:var(--display);font-size:30px;letter-spacing:.01em;color:#2a3036;white-space:nowrap;
  transform-origin:left center;transform:translateX(calc(46px - var(--a) * 16px)) scale(calc(1 - var(--a) * .12));opacity:calc(1 - var(--a) * .19);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s,color .2s}
.gl.on{color:var(--orange);text-shadow:0 2px 0 rgba(0,0,0,.06)}.gl.far{opacity:0;pointer-events:none}
.gl:hover:not(.on){color:#4a5560}
.gl .lk{font-family:var(--body);font-size:13px;font-weight:900;color:#8a9097;display:inline-flex;align-items:center;gap:4px}
.gname{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);text-align:center;pointer-events:none;z-index:2;transition:bottom .3s}
.gar.haspv .gname{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.gname .nm{font-family:var(--display);font-style:italic;font-size:clamp(30px,4.4vw,52px);color:#22272c;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.gname .sub{color:var(--orange);font-weight:900;font-size:14px;margin-top:2px}
.gpanel2{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 78px);width:min(350px,32vw);max-height:calc(100% - 210px);overflow:auto;z-index:2;pointer-events:auto;
  background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(30,35,40,.12);display:flex;flex-direction:column;gap:12px}
.gtabs{display:flex;flex-wrap:wrap;gap:6px}.gtabs button{border:0;border-radius:999px;padding:6px 11px;background:#eef0f2;font-weight:900;font-size:13px;color:#4a525a}.gtabs button.on{background:var(--ink);color:#fff}
.gar.enter .glist{animation:gIn1 .6s cubic-bezier(.2,.8,.2,1) both}.gar.enter .gpanel2{animation:gIn2 .6s .08s cubic-bezier(.2,.8,.2,1) both}.gar.enter .gname{animation:gIn3 .6s .16s cubic-bezier(.2,.8,.2,1) both}.gar.enter .gtop{animation:gIn3 .5s both}
.gname.swap .nm{animation:gNm .5s cubic-bezier(.2,.8,.2,1) both}.gname.swap .sub{animation:gNm .5s .07s cubic-bezier(.2,.8,.2,1) both}
@keyframes gNm{from{opacity:0;transform:translateX(46px) skewX(-10deg);filter:blur(3px)}}
@keyframes gIn1{from{opacity:0;transform:translateX(-50px)}}@keyframes gIn2{from{opacity:0;transform:translateX(50px)}}@keyframes gIn3{from{opacity:0;transform:translateY(24px)}}
#fade{position:fixed;inset:0;z-index:50;opacity:0;pointer-events:none;transition:opacity .26s ease}#fade.on{opacity:1}
@media (max-width:760px){
  .glist{left:0;right:0;width:auto;top:calc(env(safe-area-inset-top,0px) + 66px);overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 12px}
  .glist .in{display:flex;gap:4px;transform:none}
  .gl{transform:none!important;opacity:1!important;font-size:18px;height:38px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.7)}.gl.far{opacity:1;pointer-events:auto}.gl.on{background:#fff}
  .gpanel2{left:12px;right:12px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:36vh}
  .gname{bottom:calc(36vh + 28px)}.gar.haspv .gname{bottom:calc(36vh + 28px)}
  .gar .pvbar{bottom:calc(36vh + 80px)}
}
.garage{min-height:100%;display:flex;justify-content:flex-end;align-items:flex-start;touch-action:pan-y;cursor:grab}
.garage.grabbing{cursor:grabbing}
.gpanel{cursor:auto}
.rot-hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:900;font-size:13px;box-shadow:0 4px 0 rgba(0,0,0,.2);pointer-events:none}
@media (max-width:760px){.rot-hint{top:calc(env(safe-area-inset-top,0px) + 70px);bottom:auto}}
.gpanel{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
@media (max-width:760px){.garage{align-items:flex-end}.gpanel{margin-top:min(44vh,360px)}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:13px;display:inline-flex;align-items:center;gap:7px;font-weight:800}

/* lobby */

(()=>{

  const TIPS=['Tap the handbrake to kick the tail out.','Lift off mid-corner and the car keeps sliding – catch it.','5 seconds off the road costs you +5 seconds.','Your ghost car shows your best run – beat it.','Hit crests at speed to jump.','Read the pace note card: 1 is the tightest corner, 6 is flat out.','Free Drive builds a fresh random stage every time.'];
  let shownAt=performance.now(),hideT=0;
  function tip(){tipEl.textContent=TIPS[Math.floor(Math.random()*TIPS.length)]}
  tip();
  window.__loader={
    busy(){return !el.hidden},
    show(){clearTimeout(hideT);el.hidden=false;el.classList.remove('out');shownAt=performance.now();tip()},
    hide(min){clearTimeout(hideT);const wait=Math.max(0,(min||0)-(performance.now()-shownAt));hideT=setTimeout(()=>{el.classList.add('out');hideT=setTimeout(()=>{el.hidden=true},330)},wait)},
    paint(c){carEl.style.background=c}
  };
})();
